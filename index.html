<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생각하는 힘을 키우는 서·논술형 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 크림 바탕 · 굵은 검정 테두리 · 단단한 그림자 · 사례별 파스텔 색 */
  --cream:#fffaf0;
  --ink:#151515;
  --muted:#55595f;
  --y:#ffd84a;
  --y-t:#fff6cf;
  --coral:#ff6b4a;
  --c:#ffe27a;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --u:min(1vw,1.7vh);
  --r:calc(var(--u)*1.1);
  --bd:max(2px,calc(var(--u)*.2)) solid var(--ink);
  --sh:max(3px,calc(var(--u)*.35)) max(3px,calc(var(--u)*.35)) 0 var(--ink);
  --gap:calc(var(--u)*1.4);
  --pad:calc(var(--u)*1.6);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);word-break:keep-all;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}
img{max-width:100%;display:block}
.num{font-weight:900;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:calc(var(--u)*1);padding:calc(var(--u)*1.4) calc(var(--u)*1.8)}

/* ── 상단 노란 블록 ── */
.top{background:var(--y);border:var(--bd);box-shadow:var(--sh);border-radius:calc(var(--r)*1.3);display:flex;align-items:center;gap:calc(var(--u)*1);padding:calc(var(--u)*1) calc(var(--u)*1.8)}
.logo{display:flex;flex-direction:column;gap:.15em;cursor:pointer;min-width:0;margin-right:auto}
.logo b{font-size:calc(var(--u)*2.1);font-weight:900;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{font-size:calc(var(--u)*1);font-weight:500;white-space:nowrap}
.menu{display:flex;gap:calc(var(--u)*.6)}
.hb{font-size:calc(var(--u)*1.05);font-weight:800;padding:calc(var(--u)*.5) calc(var(--u)*1.1);border-radius:999px;background:#fff;border:var(--bd);white-space:nowrap;display:inline-flex;align-items:center;gap:.4em;transition:transform .1s,box-shadow .1s}
.hb:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.menu .hb.on{background:var(--ink);color:#fff}
.hb.play{background:var(--coral);color:#fff}
.hb.play.on{background:var(--ink)}
.hb .dot{width:.55em;height:.55em;border-radius:50%;background:#fff}
.hb.play.on .dot{background:var(--y);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.prog{height:calc(var(--u)*.7);border:var(--bd);border-radius:999px;background:#fff;overflow:hidden;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:0;background:var(--y);border-right:var(--bd)}
.app.noprog{grid-template-rows:auto 1fr}

/* ── 설정 패널 ── */
.set{position:fixed;top:calc(var(--u)*8.4);right:calc(var(--u)*2);width:min(92vw,calc(var(--u)*36));background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:var(--r);padding:calc(var(--u)*1.6);z-index:20;display:none;font-size:calc(var(--u)*1.1);max-height:calc(100vh - var(--u)*10);overflow-y:auto}
.set.on{display:block}
.set h3{font-size:1.3em;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.set h3 button{font-size:.75em;font-weight:800;border:var(--bd);border-radius:999px;padding:.15em .8em}
.set h4{font-size:.85em;font-weight:900;margin:1.1em 0 .5em;display:inline-block;background:var(--y);border:var(--bd);border-radius:999px;padding:.05em .8em}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:.4em}
.seg button,.opt{border:var(--bd);border-radius:.6em;padding:.45em .3em;font-weight:800;text-align:center;background:#fff}
.seg button.on,.opt.on{background:var(--ink);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.opt{display:flex;align-items:center;gap:.5em;text-align:left;padding:.5em .7em}
.opt small{display:block;font-weight:500;font-size:.75em;opacity:.75}
.opt.wide{grid-column:1/-1}
.vol{display:flex;align-items:center;gap:.7em}
.vol input{flex:1;accent-color:var(--coral)}
.set .hint{font-size:.8em;color:var(--muted);margin-top:.9em;line-height:1.5}
.set .go{margin-top:1em;width:100%;background:var(--coral);color:#fff;font-weight:900;border:var(--bd);box-shadow:var(--sh);border-radius:.7em;padding:.7em}

.view{min-height:0;position:relative;overflow:visible}
.page{position:absolute;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:calc(var(--u)*1);min-height:0}

/* ── 사례 머리: 파스텔 띠 ── */
.who{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.1) calc(var(--u)*1.6);background:var(--c);border:var(--bd);box-shadow:var(--sh);border-radius:var(--r)}
.badge{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:calc(var(--r)*.8);background:#fff;border:var(--bd);display:grid;place-items:center;font-size:calc(var(--u)*2)}
.who .tx{min-width:0}
.row{display:flex;align-items:center;gap:calc(var(--u)*.7);min-width:0}
.pill{background:var(--ink);color:#fff;font-weight:900;font-size:calc(var(--u)*1);padding:.2em .85em;border-radius:999px;white-space:nowrap}
.who .meta{font-size:calc(var(--u)*1.1);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who h1{font-size:calc(var(--u)*2.3);font-weight:900;line-height:1.25;margin-top:calc(var(--u)*.3);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person{text-align:right;white-space:nowrap;background:#fff;border:var(--bd);border-radius:calc(var(--r)*.8);padding:calc(var(--u)*.5) calc(var(--u)*1.1)}
.person b{display:block;font-size:calc(var(--u)*1.8);font-weight:900;line-height:1.2}
.person span{font-size:calc(var(--u)*.95);color:var(--muted);font-weight:700}
.tabs{display:flex;align-items:center;gap:calc(var(--u)*.6);flex-wrap:nowrap}
.tab{font-size:calc(var(--u)*1.1);font-weight:800;padding:calc(var(--u)*.45) calc(var(--u)*1.2);border:var(--bd);border-radius:999px;background:#fff;white-space:nowrap;transition:transform .1s,box-shadow .1s}
.tab:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.tabs .sp{flex:1}
.nx{font-size:calc(var(--u)*1.05);font-weight:800;border:var(--bd);border-radius:999px;padding:calc(var(--u)*.45) calc(var(--u)*1.1);white-space:nowrap;background:var(--c)}
.nx:hover{box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
.body{min-height:0;padding:calc(var(--u)*1.8);overflow:hidden;background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:var(--r)}
.fit{font-size:calc(var(--u)*1.5);height:100%}

/* ── 공통 내용 블록 ── */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:calc(var(--u)*2.2);height:100%;min-height:0}
.col{display:flex;flex-direction:column;gap:.8em;min-height:0}
.col .end{margin-top:auto}
.stack{display:grid;grid-template-rows:auto minmax(0,1fr);gap:1em;height:100%;min-height:0}
.cap{font-size:.7em;font-weight:900;width:fit-content;background:var(--c);border:var(--bd);border-radius:999px;padding:.1em .8em}
.key{font-size:1.75em;font-weight:900;line-height:1.4;letter-spacing:-.03em;background:var(--y-t);border-left:.22em solid var(--y);padding:.45em .7em;border-radius:0 .4em .4em 0;text-wrap:balance}
.pts{list-style:none;display:grid;gap:.5em;counter-reset:p}
.pts li{display:grid;grid-template-columns:1.6em 1fr;gap:.6em;align-items:center;background:#fff;border:var(--bd);border-radius:.6em;padding:.55em .8em;font-weight:800;line-height:1.4;counter-increment:p}
.pts li::before{content:counter(p);font-weight:900;font-size:.85em;color:#fff;background:var(--ink);border-radius:50%;width:1.75em;height:1.75em;display:grid;place-items:center}
.std{font-size:.78em;color:var(--muted);line-height:1.5;font-weight:700;display:flex;gap:.5em;align-items:center}
.std b{background:var(--ink);color:#fff;border-radius:999px;padding:.05em .7em;font-weight:900}

.shot{background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:var(--r);display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;height:100%;cursor:zoom-in;overflow:hidden;transition:transform .12s,box-shadow .12s}
.shot:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.shot .im{min-height:0;display:flex;align-items:center;justify-content:center;padding:.4em;background:#fff}
.shot img{width:100%;height:100%;object-fit:contain}
.shot figcaption{font-size:.75em;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.45em .8em;background:var(--c);border-top:var(--bd)}
.zoom{font-size:.85em;font-weight:800;background:#fff;border:var(--bd);border-radius:999px;padding:.05em .7em;white-space:nowrap}

.flow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.8em}
.st{background:#fff;border:var(--bd);border-radius:.7em;padding:.6em .75em;position:relative;display:flex;flex-direction:column;gap:.2em;min-height:5em}
.st:not(:last-child)::after{content:"▶";position:absolute;right:-.78em;top:50%;transform:translateY(-50%);font-size:.6em;line-height:1;z-index:1}
.st i{font-style:normal;font-size:1.1em;font-weight:900;line-height:1}
.st b{font-size:.92em;line-height:1.3;font-weight:900}
.st span{font-size:.7em;color:var(--muted);line-height:1.4;font-weight:700}
.st.on{background:var(--c);box-shadow:3px 3px 0 var(--ink)}

.rub{display:grid;gap:.5em;align-content:start}
.rub .r{display:grid;grid-template-columns:minmax(0,1fr) 2.4em;gap:.3em .9em;align-items:center;background:#fff;border:var(--bd);border-radius:.6em;padding:.55em .9em}
.rub .nm{font-weight:900;font-size:.92em;line-height:1.3}
.rub .tr{grid-column:1;height:.75em;background:#fff;border:var(--bd);border-radius:99px;overflow:hidden}
.rub .fl{height:100%;background:var(--c);border-right:var(--bd)}
.rub .r.max{background:var(--y-t)}
.rub .r.max .fl{background:var(--coral)}
.rub .pt{grid-row:1/3;grid-column:2;font-size:1.6em;text-align:right}
.rub.many .r{grid-template-columns:minmax(0,11em) minmax(0,1fr) 2.2em;padding:.45em .9em}
.rub.many .tr{grid-column:2}
.rub.many .pt{grid-row:auto;grid-column:3;font-size:1.4em}
.rub .lv{display:flex;gap:.25em}
.rub .lv span{flex:1;text-align:center;font-weight:900;font-size:.78em;padding:.05em 0;border-radius:.35em;border:var(--bd);background:#fff}
.rub .lv span:first-child{background:var(--c)}
.total{background:var(--y);border:var(--bd);box-shadow:var(--sh);border-radius:var(--r);padding:.9em 1.1em;display:grid;grid-template-columns:auto 1fr;align-items:end;gap:.2em 1em}
.total .t{grid-column:1/-1;font-size:.75em;font-weight:900;width:fit-content;background:#fff;border:var(--bd);border-radius:999px;padding:.05em .8em}
.total .v{font-size:3.8em;line-height:.95}
.total .v small{font-size:.3em;margin-left:.15em}
.total .s{font-size:.85em;font-weight:800;padding-bottom:.4em}
.note{background:var(--y-t);border-left:.22em solid var(--y);border-radius:0 .5em .5em 0;padding:.75em 1em;font-size:.85em;line-height:1.6;font-weight:600}
.note b{font-weight:900}

.cards{display:grid;gap:.6em;align-content:start}
.card{background:#fff;border:var(--bd);border-radius:.7em;padding:.7em .9em;display:grid;grid-template-columns:auto 1fr;gap:.15em .7em}
.card .ic{grid-row:1/3;width:1.9em;height:1.9em;border-radius:50%;background:var(--c);border:var(--bd);display:grid;place-items:center;font-weight:900;font-size:.8em}
.card b{font-size:1em;font-weight:900;line-height:1.35}
.card p{font-size:.82em;color:#30343a;line-height:1.5;font-weight:600}
.card.pr{background:#161616;color:#fff;border-color:var(--ink);grid-template-columns:1fr}
.card.pr .ic{display:none}
.card.pr b{color:#fff;font-size:.8em;display:flex;align-items:center;gap:.4em}
.card.pr b::before{content:"💬"}
.card.pr p{color:var(--y);font-weight:800;line-height:1.6}
.copy{justify-self:start;margin-top:.35em;background:var(--y);color:var(--ink);font-weight:900;font-size:.72em;border:2px solid var(--y);border-radius:.5em;padding:.25em .9em}
.copy.ok{background:#fff}

.vs{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.2);height:100%;min-height:0}
.vs .side{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:.6em;min-height:0}
.tag{width:fit-content;font-weight:900;font-size:.82em;padding:.15em .9em;border-radius:999px;border:var(--bd);background:#fff}
.tag.on{background:var(--c)}
.vs p{font-weight:800;line-height:1.45}
.vs p b{background:linear-gradient(transparent 55%,var(--y) 55%)}

.gal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:calc(var(--u)*1.6);height:100%;min-height:0;padding:0 .2em .3em 0}

/* 홈 */
.home{display:grid;grid-template-columns:27fr 73fr;gap:calc(var(--u)*1.4);position:absolute;inset:0}
.hero{background:#f7f3ea;border:var(--bd);box-shadow:var(--sh);border-radius:var(--r);padding:calc(var(--u)*1.8);display:flex;flex-direction:column;min-height:0}
.hero .kick{font-size:calc(var(--u)*.95);font-weight:900;width:fit-content;background:var(--y);border:var(--bd);border-radius:999px;padding:.15em .8em}
.hero h1{font-size:calc(var(--u)*2.6);line-height:1.3;font-weight:900;margin-top:calc(var(--u)*1.2);letter-spacing:-.04em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--y) 58%)}
.hero p{font-size:calc(var(--u)*1.1);line-height:1.6;margin-top:calc(var(--u)*1.2);font-weight:600;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.5);margin-top:calc(var(--u)*1.6)}
.legend span{font-size:calc(var(--u)*.9);font-weight:800;border:var(--bd);border-radius:999px;padding:.1em .7em}
.hero .go{display:grid;gap:calc(var(--u)*.7)}
.cover{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;cursor:zoom-in;margin-bottom:calc(var(--u)*1.4)}
.cover img{max-height:100%;max-width:100%;object-fit:contain;border:var(--bd);border-radius:calc(var(--r)*.6);box-shadow:var(--sh);transition:transform .15s}
.cover:hover img{transform:rotate(-1.5deg) scale(1.02)}
.hero .go button{background:var(--coral);color:#fff;font-weight:900;font-size:calc(var(--u)*1.2);padding:calc(var(--u)*.8) calc(var(--u)*1.2);border-radius:var(--r);border:var(--bd);box-shadow:var(--sh);text-align:center;transition:transform .1s,box-shadow .1s}
.hero .go button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.hero .go button.ghost{background:#fff;color:var(--ink)}
.tiles{background:#fff;border:var(--bd);box-shadow:var(--sh);border-radius:var(--r);padding:calc(var(--u)*2) calc(var(--u)*2);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.3);min-height:0}
.tiles h2{font-size:calc(var(--u)*1.9);font-weight:900;letter-spacing:-.03em;display:flex;align-items:baseline;gap:.6em}
.tiles h2 small{font-size:.55em;color:var(--muted);font-weight:700}
.grid10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:calc(var(--u)*16);gap:calc(var(--u)*1.1)}
.tile{background:var(--c);border:var(--bd);border-radius:var(--r);padding:calc(var(--u)*1.1) calc(var(--u)*1.2);text-align:left;display:grid;grid-template-rows:auto 1fr auto;gap:calc(var(--u)*.6);transition:transform .12s,box-shadow .12s;min-height:0;overflow:hidden}
.tile:hover{transform:translate(-3px,-3px);box-shadow:var(--sh)}
.tile .top2{display:flex;justify-content:space-between;align-items:center}
.tile .n{font-size:calc(var(--u)*1.9);line-height:1}
.tile .sj{background:#fff;border:var(--bd);font-weight:900;font-size:calc(var(--u)*.9);padding:.05em .65em;border-radius:999px;white-space:nowrap}
.tile .tp{font-size:calc(var(--u)*1.05);font-weight:800;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;align-self:start}
.tile .foot{border-top:var(--bd);padding-top:calc(var(--u)*.6);display:grid;gap:calc(var(--u)*.15)}
.tile .nm{font-size:calc(var(--u)*1.8);font-weight:900;line-height:1.2;letter-spacing:-.02em}
.tile .sc{font-size:calc(var(--u)*.92);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{font-size:calc(var(--u)*.85);color:var(--muted);font-weight:600}

/* Ⅰ장 · 원칙 */
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.6em;align-items:end;min-height:0}
.ladder div{background:#fff;border:var(--bd);border-radius:.7em .7em 0 0;padding:.65em .7em;display:flex;flex-direction:column;gap:.3em}
.ladder b{font-size:1.2em;font-weight:900}
.ladder span{font-size:.72em;line-height:1.45;font-weight:700}
.ladder .hi{background:var(--c)}
.formula{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;font-weight:900;font-size:1.3em}
.formula span{background:#fff;border:var(--bd);border-radius:.6em;padding:.3em .75em;box-shadow:3px 3px 0 var(--ink)}
.formula span.on{background:var(--coral);color:#fff}
.formula em{font-style:normal}
.gb{display:grid;grid-template-columns:5.5em 1fr 1.3fr;background:#fff;border:var(--bd);border-radius:.7em;overflow:hidden}
.gb div{padding:.55em .8em;border-bottom:var(--bd);font-size:.85em;line-height:1.45;font-weight:600}
.gb div:nth-last-child(-n+3){border-bottom:0}
.gb .h{font-weight:900;background:#f3f3f3}
.gb .h.b{background:var(--y)}
.gb .k{font-weight:900}
.gb .bt{font-weight:800;background:var(--y-t)}
.prin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:calc(var(--u)*1.2);height:100%}
.prin .c{background:var(--pc);border:var(--bd);border-radius:var(--r);padding:.9em 1em;display:flex;flex-direction:column;gap:.4em}
.prin .c i{font-style:normal;font-size:1.5em;line-height:1}
.prin .c b{font-size:1.15em;line-height:1.35;font-weight:900}
.prin .c p{font-size:.85em;line-height:1.5;font-weight:600}
.prin .c small{margin-top:auto;font-size:.72em;font-weight:900;width:fit-content;background:#fff;border:var(--bd);border-radius:999px;padding:.05em .7em}

.lb{position:fixed;inset:0;background:rgba(20,20,20,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:1em;z-index:30;padding:3vh 3vw;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:86vh;background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 var(--y)}
.lb p{color:#fff;font-size:calc(var(--u)*1.4);font-weight:800}
.lb p span{color:var(--y);margin-left:.8em;font-size:.8em}

@media (max-width:820px){
  body{overflow:auto}
  :root{--u:2.4vw}
  .app{height:auto}
  .home,.page{position:static}
  .home{grid-template-columns:1fr}
  .grid10{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
  .split,.vs{grid-template-columns:1fr}
  .shot{height:60vh}
  .flow{grid-auto-flow:row}
  .st::after{display:none}

const TABS=[["main","한눈에"],["flow","수업·평가 흐름"],["rub","채점기준"],["ai","AI 활용"],["gal","사진 자료"]];
function tabsFor(t){const a=TABS.slice();if(t.cond)a.splice(3,0,["cond","조건의 힘"]);return a;}

function tabBody(t,k){
  if(k==="main") return `<div class="split"><div class="col">${cap("핵심 한 줄")}<div class="key">${t.key}</div>${pts(t.pts)}<p class="std end"><b>${t.grade}</b>${t.std}</p></div>${shot(t.img.main)}</div>`;
  if(k==="flow") return `<div class="stack">${flowEl(t.flow)}<div class="split"><div class="col">${cap("이렇게 운영했어요")}${pts(t.pts)}</div>${shot(t.img.flow)}</div></div>`;
  if(k==="rub"){
    const r=t.rubric,max=r.level?1:Math.max(...r.items.map(x=>x[1]));
    const rows=r.items.map(x=>`<div class="r ${!r.level&&x[1]===max&&r.items.some(y=>y[1]!==max)?'max':''}"><div class="nm">${x[0]}</div>${r.level?`<div class="lv"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span></div>`:`<div class="tr"><div class="fl" style="width:${x[1]/max*100}%"></div></div>`}<div class="pt num">${r.level?"":x[1]}</div></div>`).join("");
    return `<div class="split" style="grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr)"><div class="col">${cap("평가요소와 배점")}<div class="rub ${r.items.length>5?"many":""}">${rows}</div></div><div class="col">${cap("한눈에 보는 채점")}<div class="total"><span class="t">${r.level?"수행 수준":"만점"}</span><span class="v num">${r.level?"A–E":r.total}<small>${r.level?"":"점"}</small></span><span class="s">${r.items.length}개 평가요소${r.level?" · 5단계":""}</span></div><div class="note">${r.note}</div></div></div>`;
  }
  if(k==="cond") return `<div class="vs"><div class="side"><span class="tag">조건이 없을 때</span><p>“체세포 분열로 꼬리와 뇌가 재생된다.” 세포 수는 썼지만 <b>염색체 수 변화는 빠짐</b></p>${shot(t.img.c0)}</div><div class="side"><span class="tag on">조건을 제시했을 때</span><p>세포 수 증가와 <b>염색체 수 유지</b>까지 근거로 설명</p>${shot(t.img.c1)}</div></div>`;
  if(k==="ai") return `<div class="split"><div class="col">${cap("AI는 이렇게 썼어요")}<div class="cards">${t.ai.map((a,i)=>`<div class="card ${a[2]?'pr':''}"><span class="ic num">${a[2]?"P":i+1}</span><b>${a[0]}</b><p>${a[1]}</p>${a[2]?`<button type="button" class="copy">복사하기</button>`:""}</div>`).join("")}</div></div>${shot(t.img.ai)}</div>`;
  if(k==="gal") return `<div class="gal">${t.img.gal.map(shot).join("")}</div>`;
}

function fit(){
  const f=view.querySelector(".fit");if(!f||innerWidth<=820)return;
  const body=f.parentElement,pad=parseFloat(getComputedStyle(body).paddingTop)*2;
  const set=v=>f.style.fontSize=`calc(var(--u)*${v.toFixed(2)})`;
  const over=()=>f.scrollHeight>body.clientHeight-pad+1||[...f.querySelectorAll(".col,.cards,.rub,.stack")].some(c=>c.scrollHeight>c.clientHeight+1);
  /* 남는 공간이 있으면 글자를 키우고, 넘치면 줄입니다 */
  let s=1.5;set(s);
  if(!over()){while(s<2.1){set(s+.05);if(over()){set(s);break}s+=.05}}
  else{while(over()&&s>1.05){s-=.05;set(s)}}
}
function render(){
  const t=T.find(x=>x.id===route);
  if(t){ if(!tabsFor(t).some(x=>x[0]===tab))tab="main"; view.innerHTML=casePage(t,tab); }
  else if(route==="intro") view.innerHTML=introPage(itab);
  else if(route==="principles") view.innerHTML=prinPage();
  else view.innerHTML=homePage();
  document.querySelectorAll(".menu .hb").forEach(b=>b.classList.toggle("on",b.dataset.go===route||(b.dataset.go==="home"&&!!t)));
  const want=route==="home"?"":route;
  if(location.hash.slice(1)!==want){try{history.replaceState(null,"",want?"#"+want:location.pathname+location.search)}catch(e){}}
  fit();
  if(timer)restartProg();
}
function go(r){route=r;tab="main";itab="mean";render();}

/* 클릭 */
document.addEventListener("click",e=>{
  const cp=e.target.closest(".copy");if(cp){stopAuto();const txt=cp.parentElement.querySelector("p").textContent.replace(/^“|”$/g,"");(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{cp.textContent="복사했어요 ✓";cp.classList.add("ok")}).catch(()=>{cp.textContent="복사가 막혔어요";});setTimeout(()=>{cp.textContent="복사하기";cp.classList.remove("ok")},2000);return;}
  if(!document.contains(e.target)||e.target.closest("#set,#setBtn,#auto,#lb"))return;
  const g=e.target.closest("[data-go]");if(g){stopAuto();go(g.dataset.go);return;}
  const tb=e.target.closest("[data-tab]");if(tb){stopAuto();tab=tb.dataset.tab;render();return;}
  const it=e.target.closest("[data-itab]");if(it){stopAuto();itab=it.dataset.itab;render();return;}
  const prb=e.target.closest("[data-pr]");if(prb){stopAuto();openPm(+prb.dataset.pr);return;}
  const sh=e.target.closest(".shot,.cover");if(sh){const was=!!timer;stopAuto();resumeAfterLb=was;openLb(sh.dataset.img,sh.dataset.cap);return;}
  if(e.target.closest(".view"))stopAuto();
  closeSet();
});
document.getElementById("logo").onclick=()=>{stopAuto();go("home")};
const lb=document.getElementById("lb");
function openLb(f,c){const im=document.getElementById("lbimg");im.src=I(f);im.alt=c;document.getElementById("lbcap").innerHTML=`${c}<span>✕ 또는 화면을 누르면 닫혀요${resumeAfterLb?" · 닫으면 자동 넘김이 이어져요":""}</span>`;lb.classList.add("on");}
let resumeAfterLb=false;
function closeLb(){lb.classList.remove("on");if(resumeAfterLb){resumeAfterLb=false;startAuto();}}
lb.onclick=closeLb;

function step(n){
  const t=T.find(x=>x.id===route);
  if(t){const tabs=tabsFor(t).map(x=>x[0]);let i=tabs.indexOf(tab)+n;
    if(i>=tabs.length){const j=T.indexOf(t)+1;if(j<T.length){route=T[j].id;tab="main"}else{route=timer?"intro":"principles";itab="mean"}}
    else if(i<0){const j=T.indexOf(t)-1;if(j>=0){route=T[j].id;tab=tabsFor(T[j]).slice(-1)[0][0]}else{route="intro";itab=INTRO.slice(-1)[0][0]}}
    else tab=tabs[i];}
  else if(route==="intro"){const ks=INTRO.map(x=>x[0]);let i=ks.indexOf(itab)+n;if(i>=ks.length){route=T[0].id;tab="main"}else if(i<0){route="home"}else itab=ks[i];}
  else if(route==="home"){if(n>0){route="intro";itab="mean"}}
  else if(route==="principles"){if(n>0){route=timer?"intro":"home";itab="mean"}else{route=T[T.length-1].id;tab="main"}}
  render();
}
document.addEventListener("keydown",e=>{
  if(lb.classList.contains("on")){if(e.key==="Escape")closeLb();return;}
  if(pm.classList.contains("on")){if(e.key==="Escape")closePm();else if(e.key==="ArrowRight")openPm((pmI+1)%8);else if(e.key==="ArrowLeft")openPm((pmI+7)%8);return;}
  if(e.key==="Escape"){closeSet();return;}
  if(e.target.closest&&e.target.closest("#set"))return;
  if(e.key==="ArrowRight"){stopAuto();step(1)}else if(e.key==="ArrowLeft"){stopAuto();step(-1)}else if(e.key==="Home"){stopAuto();go("home")}
});

/* ============ 부스 설정 · 저장 ============ */
const store={get(k,d){try{const v=localStorage.getItem("sn-"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("sn-"+k,JSON.stringify(v))}catch(e){}}};
let secs=store.get("secs",12),track=store.get("track","none"),vol=store.get("vol",40);
const SECS=[5,8,12,15,20,30];
const TRACKS=[["none","없음","음악 끄기"],["piano","잔잔한 피아노","부드러운 화음 연주"],["pad","앰비언트","넓게 퍼지는 배경음"],["box","오르골","맑은 종소리 멜로디"],["beat","신나는 비트","드럼과 베이스, 경쾌한 팝"],["marimba","경쾌한 마림바","통통 튀는 리듬"],["dance","댄스 파티 🔥","128BPM 강한 비트와 신스 후렴"],["funk","펑키 그루브 🔥","들썩이는 베이스와 브라스"],["file","내 음악 파일","이 기기의 음악 고르기",1]];
const setEl=document.getElementById("set"),setBtn=document.getElementById("setBtn");
function drawSet(){
  document.getElementById("seg").innerHTML=SECS.map(s=>`<button type="button" class="num ${s===secs?'on':''}" data-s="${s}">${s}초</button>`).join("");
  document.getElementById("opts").innerHTML=TRACKS.map(x=>`<button type="button" class="opt ${x[0]===track?'on':''} ${x[3]?'wide':''}" data-t="${x[0]}"><span>${x[0]===track?'●':'○'}</span><span>${x[1]}<small>${x[0]==="file"&&fileName?fileName:x[2]}</small></span></button>`).join("");
  document.getElementById("vol").value=vol;document.getElementById("volTx").textContent=vol;
  updAutoTx();
}
function openSet(){setEl.classList.add("on");setBtn.setAttribute("aria-expanded","true");drawSet();}
function closeSet(){setEl.classList.remove("on");setBtn.setAttribute("aria-expanded","false");}
setBtn.onclick=()=>setEl.classList.contains("on")?closeSet():openSet();
document.getElementById("setClose").onclick=closeSet;
document.getElementById("seg").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;secs=+b.dataset.s;store.set("secs",secs);drawSet();if(timer){startAuto()}};
document.getElementById("opts").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const t=b.dataset.t;
  if(t==="file"){document.getElementById("file").click();return;}
  track=t;store.set("track",t);music.play(t);drawSet();};
let fileName="";
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;fileName=f.name;track="file";music.playFile(f);drawSet();};
document.getElementById("vol").oninput=e=>{vol=+e.target.value;document.getElementById("volTx").textContent=vol;store.set("vol",vol);music.setVol(vol)};
document.getElementById("startAll").onclick=()=>{if(track!=="none"&&!music.on)music.play(track==="file"&&!fileName?"none":track);startAuto();closeSet();};

/* ============ 자동 넘김 ============ */
let timer=null,progT=null,t0=0;const autoBtn=document.getElementById("auto"),progEl=document.getElementById("prog");
function updAutoTx(){document.getElementById("autoTx").textContent=timer?`넘기는 중 · ${secs}초`:`자동 넘김 ${secs}초`;}
function restartProg(){t0=performance.now();}
function startAuto(){
  stopAuto(true);
  if(route==="home"||route==="principles"){route=T[0].id;tab="main";render();}
  timer=setInterval(()=>step(1),secs*1000);restartProg();
  autoBtn.classList.add("on");autoBtn.setAttribute("aria-pressed","true");lb.classList.remove("on");updAutoTx();
}
function stopAuto(silent){
  if(timer){clearInterval(timer);timer=null}if(progT){clearInterval(progT);progT=null}
  progEl.style.width="0";document.getElementById("app").classList.add("noprog");document.getElementById("progW").classList.remove("on");autoBtn.classList.remove("on");autoBtn.setAttribute("aria-pressed","false");updAutoTx();
}
autoBtn.onclick=()=>{if(timer){stopAuto();return;}if(track!=="none"&&!music.on&&track!=="file")music.play(track);startAuto();};

/* ============ 배경 음악 (브라우저에서 직접 합성) ============ */
const music=(()=>{
  let ctx=null,master=null,wet=null,sched=null,nextT=0,beat=0,mode="none",audio=null,on=false;
  const N=m=>440*Math.pow(2,(m-69)/12);
  const PROG=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]]; // Cmaj7 Am7 Fmaj7 G7
  function init(){
    if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=vol/100*.5;master.connect(ctx.destination);
    const d=ctx.createDelay(1);d.delayTime.value=.32;const fb=ctx.createGain();fb.gain.value=.38;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
    wet=ctx.createGain();wet.gain.value=.35;wet.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(master);
  }
  function tone(f,t,dur,type,peak,att){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);g.connect(wet);o.start(t);o.stop(t+dur+.05);
  }
  function pad(fs,t,dur){
    const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=900;const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+2.5);g.gain.setValueAtTime(.06,t+dur-2);g.gain.linearRampToValueAtTime(0,t+dur+1);
    f.connect(g);g.connect(master);g.connect(wet);
    fs.forEach(fr=>[-6,6].forEach(dt=>{const o=ctx.createOscillator();o.type="sawtooth";o.frequency.value=fr;o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+dur+1.2)}));
  }
  let noiseBuf=null;
  function noise(){if(noiseBuf)return noiseBuf;const n=ctx.sampleRate;noiseBuf=ctx.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return noiseBuf;}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(master);o.start(t);o.stop(t+.35);}
  function hit(t,type,freq,dur,peak){const src=ctx.createBufferSource();src.buffer=noise();const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ctx.createGain();g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(f);f.connect(g);g.connect(master);src.start(t);src.stop(t+dur+.02);}
  function bass(f,t,dur){const o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();o.type="sawtooth";o.frequency.value=f;lp.type="lowpass";lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(220,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.13,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
  function stab(fs,t){const lp=ctx.createBiquadFilter(),g=ctx.createGain();lp.type="lowpass";lp.frequency.value=2400;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.22);lp.connect(g);g.connect(master);g.connect(wet);fs.forEach(fr=>{const o=ctx.createOscillator();o.type="square";o.frequency.value=fr;o.connect(lp);o.start(t);o.stop(t+.25)});}
  const POP=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]]; // C G Am F
  const HOOK=[76,null,79,null,81,79,76,null,74,null,76,null,72,null,null,null];
  const PENTA=[72,74,76,79,81,84,86,88];let mel=3;
  let pump=null;
  function bus(){if(!pump){pump=ctx.createGain();pump.connect(master);pump.connect(wet)}return pump;}
  function duck(t){const g=bus().gain;g.cancelScheduledValues(t);g.setValueAtTime(.25,t);g.linearRampToValueAtTime(1,t+.22);}
  function syn(f,t,dur,type,peak,att,cut,dest,det){const o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;lp.type="lowpass";lp.frequency.value=cut||4000;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(lp);lp.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.03);}
  function saws(fs,t,dur,peak,cut){fs.forEach(f=>[-14,-5,5,14].forEach(d=>syn(f,t,dur,"sawtooth",peak,.008,cut,bus(),d)));}
  function bigKick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.38);o.connect(g);g.connect(master);o.start(t);o.stop(t+.4);hit(t,"highpass",4000,.02,.15);}
  function clap(t,v){[0,.012,.024].forEach(d=>hit(t+d,"bandpass",1400,.14,(v||.35)));}
  const DANCE=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]]; // Am F C G
  const LEAD=[76,76,79,76,null,74,72,null,76,null,79,81,79,76,74,72];
  const FUNK=[[62,65,69,72],[67,71,74,77]]; // Dm7 G7
  const SLAP=[0,null,null,12,null,null,0,10,null,0,null,12,0,null,7,null];
  function tick(){
    while(nextT<ctx.currentTime+1.2){
      if(mode==="piano"){const sp=.42,ch=PROG[Math.floor(beat/8)%4],pat=[0,1,2,3,2,1,2,1];
        if(beat%8===0)tone(N(ch[0]-12),nextT,3.2,"sine",.16,.01);
        tone(N(ch[pat[beat%8]]+(beat%8===3?12:0)),nextT,1.6,"triangle",.09,.008);nextT+=sp;}
      else if(mode==="pad"){const ch=PROG[beat%4];pad(ch.map(m=>N(m-12)),nextT,8);tone(N(ch[0]-24),nextT,8,"sine",.08,2);nextT+=8;}
      else if(mode==="box"){const sp=.5;if(Math.random()<.82){mel=Math.max(0,Math.min(PENTA.length-1,mel+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)]));const f=N(PENTA[mel]);tone(f,nextT,1.8,"sine",.1,.004);tone(f*2,nextT,.7,"sine",.025,.004);}
        if(beat%8===0)tone(N(PROG[Math.floor(beat/8)%4][0]),nextT,3,"sine",.05,.02);nextT+=sp;}
      else if(mode==="beat"){const sp=.125,st=beat%16,bar=Math.floor(beat/16),ch=POP[bar%4];
        if(st%4===0)kick(nextT);
        if(st===4||st===12)hit(nextT,"bandpass",1800,.18,.32);
        if(st%2===0)hit(nextT,"highpass",7500,st%4===2?.09:.04,st%4===2?.12:.06);
        if(st%2===0)bass(N(ch[0]-24+(st%4===2?12:0)),nextT,.22);
        if(st===2||st===6||st===10||st===14)stab(ch.map(N),nextT);
        if(bar%2===1&&HOOK[st]){tone(N(HOOK[st]),nextT,.35,"triangle",.07,.005)}
        nextT+=sp;}
      else if(mode==="marimba"){const sp=.14,st=beat%16,ch=PROG[Math.floor(beat/16)%4],pat=[0,2,1,3,2,1,3,2,0,3,1,2,3,1,2,3];
        if([0,3,6,8,10,13].includes(st)){const f=N(ch[pat[st]]+12);tone(f,nextT,.45,"sine",.13,.003);tone(f*4,nextT,.08,"sine",.03,.002)}
        if(st%8===0)tone(N(ch[0]-12),nextT,.6,"sine",.16,.004);
        if(st%4===2)hit(nextT,"highpass",9000,.05,.05);
        if(st===4||st===12)hit(nextT,"bandpass",2500,.06,.08);
        nextT+=sp;}
      else if(mode==="dance"){const sp=60/128/4,st=beat%16,bar=Math.floor(beat/16)%8,ch=DANCE[bar%4],t=nextT;
        const drop=bar>=4,build=bar===3;
        if(st%4===0&&!(build&&st>=8)){bigKick(t);duck(t)}
        if(st===4||st===12)clap(t,build?.3:.4);
        if(st%4===2)hit(t,"highpass",6500,drop?.16:.1,drop?.14:.09);
        else hit(t,"highpass",9000,.03,.04);
        if(build&&st>=8)hit(t,"bandpass",1800,.08,.06+(st-8)*.035);
        if(st%4!==0)syn(N(ch[0]-24+(st%2?12:0)),t,.11,"sawtooth",.12,.005,700,bus());
        if(st%4===2||(drop&&st%8===7))saws(ch.map(m=>N(m)),t,.2,.012,drop?5200:2600);
        if(drop&&LEAD[st]){syn(N(LEAD[st]),t,.22,"square",.05,.005,3500,bus());syn(N(LEAD[st]+12),t,.18,"sawtooth",.025,.005,6000,bus(),8)}
        nextT+=sp;}
      else if(mode==="funk"){const sp=60/112/4,st=beat%16,bar=Math.floor(beat/16),ch=FUNK[bar%2],t=nextT,sw=st%2?sp*.18:0;
        if([0,3,6,10].includes(st))kick(t+sw);
        if(st===4||st===12)clap(t+sw,.3);
        if(st===7||st===14)hit(t+sw,"bandpass",1600,.06,.08);
        hit(t+sw,"highpass",8000,.03,st%2?.04:.07);
        if(SLAP[st]!==null){syn(N(ch[0]-24+SLAP[st]),t+sw,.16,"sawtooth",.16,.004,1100)}
        if([2,5,9,11,15].includes(st))ch.slice(1).forEach(m=>syn(N(m),t+sw,.09,"square",.03,.003,3000));
        if(st===0&&bar%2===0)ch.forEach(m=>[-8,8].forEach(d=>syn(N(m+12),t,.32,"sawtooth",.035,.01,2600,master,d)));
        if(st===14&&bar%2===1)ch.forEach(m=>[-8,8].forEach(d=>syn(N(m+12),t+sw,.18,"sawtooth",.03,.01,2600,master,d)));
        nextT+=sp;}
      else return;
      beat++;
    }
  }
  function stopAll(){noiseBuf=null;pump=null;
    if(sched){clearInterval(sched);sched=null}
    if(audio){audio.pause();audio=null}
    if(ctx){const c=ctx,m=master;try{m.gain.setTargetAtTime(0,c.currentTime,.25)}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},1500);ctx=null;master=null;wet=null}
    on=false;mode="none";
  }
  return{
    get on(){return on},
    play(m){stopAll();if(m==="none"||m==="file")return;init();ctx.resume&&ctx.resume();mode=m;beat=0;nextT=ctx.currentTime+.15;tick();sched=setInterval(tick,250);on=true;},
    playFile(f){stopAll();audio=new Audio(URL.createObjectURL(f));audio.loop=true;audio.volume=vol/100;audio.play().catch(()=>{});on=true;mode="file";},
    setVol(v){if(master&&ctx)master.gain.setTargetAtTime(v/100*.5,ctx.currentTime,.05);if(audio)audio.volume=v/100;}
  };
})();

addEventListener("hashchange",()=>{const h=location.hash.slice(1)||"home";if(h!==route)go(h)});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(fit,80)});
{const h=location.hash.slice(1);if(h==="intro"||h==="principles"||T.some(t=>t.id===h))route=h;}
render();updAutoTx();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
addEventListener("load",fit);
